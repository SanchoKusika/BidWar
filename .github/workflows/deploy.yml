name: Deploy

on:
  push:
    branches: [main]
  pull_request:

# Один деплой на ветку: старый отменяется, если пришёл новый коммит.
concurrency:
  group: deploy-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Без секретов Cloudflare (форк, свежий клон) деплой пропускается,
      # а не валит проверки на pull request.
      - name: Проверить доступы Cloudflare
        id: gate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Секреты Cloudflare не заданы — деплой пропущен."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Установить зависимости
        if: steps.gate.outputs.ready == 'true'
        run: npm ci

      # VITE_* попадают в бандл на этапе сборки, поэтому задаются здесь,
      # а не в настройках Pages. Ключ публичный, потому переменная, не секрет.
      - name: Собрать
        if: steps.gate.outputs.ready == 'true'
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "::error::Не заданы VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY — Settings → Secrets and variables → Actions → Variables"
            exit 1
          fi
          npm run build

      # main → продакшн, любая другая ветка → превью-окружение Pages.
      - name: Выложить на Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name bidwar
          --branch "${{ github.head_ref || github.ref_name }}"
